<div class="min-h-screen bg-[#08090b] flex flex-col text-[#f4f4f6] font-sans selection:bg-white/20 selection:text-white">
  <header class="bg-[#0f1115]/85 border-b border-white/[0.08] px-3.5 sm:px-6 py-2.5 sm:py-3.5 backdrop-blur-xl sticky top-0 z-40">
    <div class="flex items-center justify-between max-w-7xl mx-auto w-full">
      <div class="flex items-center space-x-2.5 sm:space-x-3.5">
        <div class="w-7 h-7 sm:w-8 sm:h-8 rounded-lg bg-white/[0.04] border border-white/[0.1] flex items-center justify-center text-white shadow-inner">
          <svg class="w-3.5 h-3.5 sm:w-4 sm:h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
            <circle cx="12" cy="12" r="3"></circle>
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"></path>
          </svg>
        </div>
        <div>
          <div class="flex items-center space-x-2">
            <span class="text-xs font-semibold tracking-widest uppercase text-white">ARGUS</span>
            <span class="text-zinc-600">/</span>
            <span class="text-xs text-zinc-300 font-medium">Vision</span>
            <span class="text-[9px] sm:text-[10px] font-mono px-1.5 sm:px-2 py-0.5 rounded-full bg-white/[0.04] text-zinc-400 border border-white/[0.08]">
              YOLO26m
            </span>
          </div>
          <p class="hidden sm:block text-[11px] text-zinc-500 font-normal">
            Autonomous Suspicion Heuristics &bull; Concealment &bull; Rapid Checks &bull; Shelf Loitering
          </p>
        </div>
      </div>

      <div class="flex items-center space-x-2 sm:space-x-3">
        <div class="flex items-center space-x-1.5 sm:space-x-2 text-[10px] sm:text-[11px] font-mono px-2 sm:px-3 py-1 sm:py-1.5 rounded-lg bg-white/[0.03] border border-white/[0.08] text-zinc-300">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400" [ngClass]="wsService.isConnected() ? 'animate-pulse' : ''"></span>
          <span class="hidden xs:inline text-zinc-500">FEED</span>
          <span class="text-zinc-200 font-medium">
            {{ wsService.isConnected() ? 'ONLINE' : 'HTTP' }}
          </span>
        </div>

        <div class="hidden md:flex items-center space-x-2 text-[11px] font-mono px-3 py-1.5 rounded-lg bg-white/[0.03] border border-white/[0.08] text-zinc-300">
          <span class="w-1.5 h-1.5 rounded-full bg-zinc-400"></span>
          <span class="text-zinc-500">DB</span>
          <span class="text-zinc-300">NEON PG</span>
        </div>
      </div>
    </div>
  </header>

  <div class="lg:hidden px-3.5 pt-3 pb-1 border-b border-white/[0.06] bg-[#0c0d11]">
    <div class="flex p-0.5 rounded-xl bg-black/40 border border-white/[0.08] font-mono text-xs">
      <button
        type="button"
        (click)="setMobileTab('feed')"
        [ngClass]="activeMobileTab() === 'feed' ? 'bg-white/[0.1] text-white font-medium shadow-sm' : 'text-zinc-500 hover:text-zinc-300'"
        class="flex-1 py-1.5 rounded-lg text-center transition-all">
        FEED
      </button>

      <button
        type="button"
        (click)="setMobileTab('alerts')"
        [ngClass]="activeMobileTab() === 'alerts' ? 'bg-white/[0.1] text-white font-medium shadow-sm' : 'text-zinc-500 hover:text-zinc-300'"
        class="flex-1 py-1.5 rounded-lg text-center transition-all relative flex items-center justify-center space-x-1.5">
        <span>INCIDENTS</span>
        <span
          *ngIf="alertsService.metrics().highRiskCount > 0"
          class="px-1.5 py-0.2 rounded-full text-[9px] bg-rose-500/20 text-rose-300 border border-rose-500/40">
          {{ alertsService.metrics().highRiskCount }}
        </span>
      </button>

      <button
        type="button"
        (click)="setMobileTab('calibration')"
        [ngClass]="activeMobileTab() === 'calibration' ? 'bg-white/[0.1] text-white font-medium shadow-sm' : 'text-zinc-500 hover:text-zinc-300'"
        class="flex-1 py-1.5 rounded-lg text-center transition-all">
        CALIBRATE
      </button>
    </div>
  </div>

  <main class="flex-1 max-w-7xl mx-auto w-full p-3 sm:p-6">
    <div class="hidden lg:grid lg:grid-cols-12 gap-6">
      <div class="lg:col-span-8 flex flex-col space-y-6">
        <div class="h-[520px]">
          <app-camera-stream></app-camera-stream>
        </div>

        <div>
          <app-calibration-panel></app-calibration-panel>
        </div>
      </div>

      <div class="lg:col-span-4 h-full min-h-[600px]">
        <app-alerts-sidebar></app-alerts-sidebar>
      </div>
    </div>

    <div class="lg:hidden">
      <div *ngIf="activeMobileTab() === 'feed'" class="h-[420px] xs:h-[460px] sm:h-[500px]">
        <app-camera-stream></app-camera-stream>
      </div>

      <div *ngIf="activeMobileTab() === 'alerts'" class="min-h-[500px]">
        <app-alerts-sidebar></app-alerts-sidebar>
      </div>

      <div *ngIf="activeMobileTab() === 'calibration'">
        <app-calibration-panel></app-calibration-panel>
      </div>
    </div>
  </main>

  <footer class="border-t border-white/[0.06] bg-[#0b0c0f] px-4 sm:px-6 py-3 text-center text-xs text-zinc-500 font-normal">
    <span class="font-mono text-zinc-400 text-[11px]">ARGUS VISION SYSTEM</span> &bull; Multi-Object Pose Analysis &bull; Kysely Type-Safe PostgreSQL
  </footer>
</div>
