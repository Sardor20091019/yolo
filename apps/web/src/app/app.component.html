<div class="min-h-screen bg-slate-50 dark:bg-[#0b0b09] text-slate-800 dark:text-[#d0cdc4] flex flex-col font-sans transition-colors duration-200">

  <header class="border-b hairline sticky top-0 z-40 bg-white/95 dark:bg-[#0b0b09]/95 backdrop-blur-md transition-colors duration-200">
    <div class="max-w-screen-xl mx-auto px-4 sm:px-6 py-2.5 flex items-center justify-between">

      <div class="flex items-center space-x-6">
        <div class="flex items-center space-x-3">
          <div class="w-8 h-8 flex items-center justify-center border hairline bg-slate-100 dark:bg-[#141412] rounded">
            <svg class="w-4 h-4 text-emerald-600 dark:text-[#10b981]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/>
            </svg>
          </div>
          <div>
            <div class="flex items-center space-x-2">
              <span class="font-sans font-bold text-sm tracking-tight text-slate-900 dark:text-white">Astro CCTV</span>
              <span class="tag tag-green rounded text-[0.6rem] py-0.5 px-1.5 font-mono">LIVE THEFT AI</span>
            </div>
            <div class="label text-[0.58rem]">YOLO26 &bull; WebRTC Surveillance Multiplex</div>
          </div>
        </div>

        <nav class="hidden md:flex items-center space-x-1">
          <button
            type="button"
            (click)="setActiveTab('feed')"
            [style.color]="activeTab() === 'feed' ? (themeService.isDark() ? '#ffffff' : '#0f172a') : (themeService.isDark() ? '#8c8880' : '#64748b')"
            [style.border-bottom]="activeTab() === 'feed' ? '2px solid #10b981' : '2px solid transparent'"
            class="px-3.5 py-2 text-xs font-mono tracking-wider uppercase transition-colors"
            style="background:transparent; border-top:0; border-left:0; border-right:0; cursor:pointer; font-size:0.7rem">
            📹 Camera Node
          </button>
          <button
            type="button"
            (click)="setActiveTab('cctv')"
            [style.color]="activeTab() === 'cctv' ? (themeService.isDark() ? '#ffffff' : '#0f172a') : (themeService.isDark() ? '#8c8880' : '#64748b')"
            [style.border-bottom]="activeTab() === 'cctv' ? '2px solid #10b981' : '2px solid transparent'"
            class="px-3.5 py-2 text-xs font-mono tracking-wider uppercase transition-colors flex items-center space-x-1.5"
            style="background:transparent; border-top:0; border-left:0; border-right:0; cursor:pointer; font-size:0.7rem">
            <span>🛡️ Admin CCTV Matrix</span>
            <span *ngIf="wsService.cctvStations().length > 0" class="tag tag-green rounded text-[0.58rem] px-1">
              {{ wsService.cctvStations().length }}
            </span>
          </button>
          <button
            type="button"
            (click)="setActiveTab('logs')"
            [style.color]="activeTab() === 'logs' ? (themeService.isDark() ? '#ffffff' : '#0f172a') : (themeService.isDark() ? '#8c8880' : '#64748b')"
            [style.border-bottom]="activeTab() === 'logs' ? '2px solid #10b981' : '2px solid transparent'"
            class="px-3.5 py-2 text-xs font-mono tracking-wider uppercase transition-colors"
            style="background:transparent; border-top:0; border-left:0; border-right:0; cursor:pointer; font-size:0.7rem">
            Detection Logs
            <span *ngIf="logService.logs().length > 0" class="ml-1.5 tag rounded text-[0.6rem]">{{ logService.logs().length }}</span>
          </button>
        </nav>
      </div>

      <div class="flex items-center space-x-2.5">
        <button
          type="button"
          (click)="toggleRole()"
          class="flex items-center space-x-1.5 px-2.5 py-1 rounded text-xs font-mono border hairline transition-all cursor-pointer"
          [ngClass]="authService.isAdmin() ? 'bg-amber-500/10 text-amber-600 dark:text-amber-400 border-amber-500/30' : 'bg-slate-100 dark:bg-[#141412] text-slate-700 dark:text-[#8c8880] border-slate-300 dark:border-white/10'"
          title="Click to switch between User (Camera Node) and Admin (All Cameras)">
          <span class="status-dot" [style.background]="authService.isAdmin() ? '#f59e0b' : '#10b981'"></span>
          <span class="font-bold text-[0.65rem] uppercase">
            {{ authService.isAdmin() ? 'ADMIN' : 'USER' }}
          </span>
          <span class="text-[0.6rem] opacity-75 hidden sm:inline">(Switch)</span>
        </button>

        <button
          type="button"
          (click)="themeService.toggleTheme()"
          class="btn-ghost flex items-center justify-center p-2 rounded"
          [title]="themeService.isDark() ? 'Switch to Light Mode' : 'Switch to Dark Mode'">
          <svg *ngIf="themeService.isDark()" class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
          </svg>
          <svg *ngIf="!themeService.isDark()" class="w-4 h-4 text-slate-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
          </svg>
        </button>

        <div class="hidden md:flex items-center space-x-2 border hairline px-2.5 py-1 rounded bg-slate-100 dark:bg-[#111110]">
          <span
            class="status-dot"
            [style.background]="wsService.isConnected() && wsService.isYoloActive() ? '#10b981' : '#ef4444'"></span>
          <span
            class="font-mono text-xs"
            [style.color]="wsService.isConnected() && wsService.isYoloActive() ? '#10b981' : '#ef4444'"
            style="font-size:0.65rem">
            {{ !wsService.isConnected() ? 'Offline' : (wsService.isYoloActive() ? 'YOLO Online' : 'YOLO Degraded') }}
          </span>
        </div>

        <div *ngIf="authService.currentUser() as user" class="relative">
          <button
            type="button"
            (click)="toggleAccountMenu()"
            class="flex items-center space-x-2 border hairline px-2.5 py-1.5 transition-colors cursor-pointer rounded bg-slate-100 dark:bg-[#111110]">
            <div class="w-5 h-5 rounded-full flex items-center justify-center text-[0.65rem] font-mono bg-slate-200 dark:bg-[#171715] text-emerald-600 dark:text-[#10b981]">
              {{ user.name.slice(0, 1).toUpperCase() }}
            </div>
            <span class="text-xs font-sans font-medium truncate max-w-[100px] text-slate-900 dark:text-[#d0cdc4]">{{ user.name }}</span>
          </button>
        </div>
      </div>

    </div>

    <div class="md:hidden border-t hairline px-3 py-1.5 flex justify-around bg-slate-50 dark:bg-[#0e0e0c]">
      <button
        type="button"
        (click)="setActiveTab('feed')"
        [style.color]="activeTab() === 'feed' ? '#10b981' : (themeService.isDark() ? '#8c8880' : '#64748b')"
        class="py-1 text-xs font-mono uppercase tracking-wider transition-colors"
        style="background:transparent; border:none; cursor:pointer">Camera Node</button>
      <button
        type="button"
        (click)="setActiveTab('cctv')"
        [style.color]="activeTab() === 'cctv' ? '#10b981' : (themeService.isDark() ? '#8c8880' : '#64748b')"
        class="py-1 text-xs font-mono uppercase tracking-wider transition-colors"
        style="background:transparent; border:none; cursor:pointer">Admin Matrix</button>
      <button
        type="button"
        (click)="setActiveTab('logs')"
        [style.color]="activeTab() === 'logs' ? '#10b981' : (themeService.isDark() ? '#8c8880' : '#64748b')"
        class="py-1 text-xs font-mono uppercase tracking-wider transition-colors"
        style="background:transparent; border:none; cursor:pointer">Logs</button>
    </div>
  </header>

  <main class="flex-1 max-w-screen-xl mx-auto w-full px-4 sm:px-6 py-5" (click)="closeAccountMenu()">

    <div *ngIf="activeTab() === 'feed'">
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-5">
        <div class="lg:col-span-8 flex flex-col space-y-5">
          <div style="min-height:520px; height:560px">
            <app-camera-stream></app-camera-stream>
          </div>
        </div>
        <div class="lg:col-span-4">
          <app-detection-log></app-detection-log>
        </div>
      </div>
    </div>

    <div *ngIf="activeTab() === 'cctv'">
      <app-admin-cctv></app-admin-cctv>
    </div>

    <div *ngIf="activeTab() === 'logs'">
      <app-detection-log></app-detection-log>
    </div>

  </main>

  <footer class="border-t hairline px-4 sm:px-6 py-3 mt-auto bg-white dark:bg-[#0e0e0c] transition-colors duration-200">
    <div class="max-w-screen-xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-2 text-center sm:text-left">
      <div class="flex items-center space-x-3">
        <span class="status-dot animate-live" style="background:#10b981"></span>
        <span class="label text-[0.65rem]">Astro CCTV &bull; YOLO26 + MediaPipe Tasks + WebRTC P2P</span>
      </div>
      <div class="label text-[0.65rem] text-slate-500 dark:text-[#8c8880]">Real-Time Anti-Shoplifting &bull; Multi-Camera Surveillance</div>
    </div>
  </footer>

</div>
