<div class="min-h-screen bg-[#08090b] flex flex-col text-[#f4f4f6] font-sans selection:bg-white/20 selection:text-white">
  <header class="bg-[#0f1115]/85 border-b border-white/[0.08] px-4 sm:px-6 py-3 backdrop-blur-xl sticky top-0 z-40">
    <div class="flex items-center justify-between max-w-7xl mx-auto w-full">
      <div class="flex items-center space-x-3">
        <div class="w-8 h-8 rounded-lg bg-white/[0.04] border border-white/[0.1] flex items-center justify-center text-white shadow-inner">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
            <circle cx="12" cy="12" r="3"></circle>
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
          </svg>
        </div>
        <div>
          <span class="text-sm font-semibold tracking-wide text-white">ASTROVision</span>
        </div>
      </div>

      <div class="flex items-center space-x-2 text-[11px] font-mono px-3 py-1.5 rounded-lg bg-white/[0.03] border border-white/[0.08] text-zinc-300">
        <span class="w-2 h-2 rounded-full" [ngClass]="wsService.isConnected() ? 'bg-emerald-400 animate-pulse' : 'bg-zinc-500'"></span>
        <span class="text-zinc-200 font-medium">
          {{ wsService.isConnected() ? 'CONNECTED' : 'STANDALONE' }}
        </span>
      </div>
    </div>
  </header>

  <div class="lg:hidden px-3.5 pt-3 pb-1 border-b border-white/[0.06] bg-[#0c0d11]">
    <div class="flex p-0.5 rounded-xl bg-black/40 border border-white/[0.08] font-mono text-xs">
      <button
        type="button"
        (click)="setMobileTab('feed')"
        [ngClass]="activeMobileTab() === 'feed' ? 'bg-white/[0.1] text-white font-medium shadow-sm' : 'text-zinc-500 hover:text-zinc-300'"
        class="flex-1 py-1.5 rounded-lg text-center transition-all">
        CAMERA
      </button>

      <button
        type="button"
        (click)="setMobileTab('logs')"
        [ngClass]="activeMobileTab() === 'logs' ? 'bg-white/[0.1] text-white font-medium shadow-sm' : 'text-zinc-500 hover:text-zinc-300'"
        class="flex-1 py-1.5 rounded-lg text-center transition-all relative flex items-center justify-center space-x-1.5">
        <span>LOGS</span>
        <span
          *ngIf="logService.logs().length > 0"
          class="px-1.5 py-0.2 rounded-full text-[9px] bg-emerald-500/20 text-emerald-300 border border-emerald-500/40">
          {{ logService.logs().length }}
        </span>
      </button>

      <button
        type="button"
        (click)="setMobileTab('alerts')"
        [ngClass]="activeMobileTab() === 'alerts' ? 'bg-white/[0.1] text-white font-medium shadow-sm' : 'text-zinc-500 hover:text-zinc-300'"
        class="flex-1 py-1.5 rounded-lg text-center transition-all relative flex items-center justify-center space-x-1.5">
        <span>INCIDENTS</span>
        <span
          *ngIf="alertsService.metrics().highRiskCount > 0"
          class="px-1.5 py-0.2 rounded-full text-[9px] bg-rose-500/20 text-rose-300 border border-rose-500/40">
          {{ alertsService.metrics().highRiskCount }}
        </span>
      </button>
    </div>
  </div>

  <main class="flex-1 max-w-7xl mx-auto w-full p-3.5 sm:p-6">
    <div class="hidden lg:grid lg:grid-cols-12 gap-6">
      <div class="lg:col-span-8 flex flex-col space-y-6">
        <div class="h-[520px]">
          <app-camera-stream></app-camera-stream>
        </div>

        <div>
          <app-detection-log></app-detection-log>
        </div>
      </div>

      <div class="lg:col-span-4 h-full min-h-[600px]">
        <app-alerts-sidebar></app-alerts-sidebar>
      </div>
    </div>

    <div class="lg:hidden">
      <div *ngIf="activeMobileTab() === 'feed'" class="h-[440px] xs:h-[480px] sm:h-[520px]">
        <app-camera-stream></app-camera-stream>
      </div>

      <div *ngIf="activeMobileTab() === 'logs'">
        <app-detection-log></app-detection-log>
      </div>

      <div *ngIf="activeMobileTab() === 'alerts'" class="min-h-[500px]">
        <app-alerts-sidebar></app-alerts-sidebar>
      </div>
    </div>
  </main>

  <footer class="border-t border-white/[0.06] bg-[#0b0c0f] px-4 sm:px-6 py-3 text-center text-xs text-zinc-500 font-normal">
    <span>ASTROVision &bull; Real-Time Optical Detection System</span>
  </footer>
</div>
