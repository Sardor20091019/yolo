<div class="flex flex-col h-full bg-[#0c0d11] border border-white/[0.07] rounded-2xl overflow-hidden shadow-2xl">
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between px-3.5 sm:px-5 py-3 sm:py-3.5 bg-[#101216]/60 border-b border-white/[0.06] backdrop-blur gap-2.5">
    <div class="flex items-center justify-between sm:justify-start space-x-2.5">
      <div class="flex items-center space-x-2">
        <div class="relative flex items-center justify-center">
          <span class="w-2 h-2 rounded-full" [ngClass]="isStreaming() ? 'bg-emerald-400 animate-ping' : 'bg-zinc-600'"></span>
          <span class="absolute w-1.5 h-1.5 rounded-full" [ngClass]="isStreaming() ? 'bg-emerald-400' : 'bg-zinc-500'"></span>
        </div>
        <span class="font-mono text-[11px] font-medium tracking-wider uppercase text-zinc-300">
          {{ mode() === 'WEBCAM' ? 'OPTICAL FEED' : 'IP FEED' }}
        </span>
        <span *ngIf="isStreaming()" class="px-1.5 py-0.5 rounded text-[9px] font-mono font-medium bg-emerald-500/10 text-emerald-300 border border-emerald-500/20">
          LIVE
        </span>
      </div>

      <div class="flex items-center space-x-2 font-mono text-[10px] text-zinc-400 bg-black/40 px-2.5 py-1 rounded-lg border border-white/[0.06]">
        <span class="text-zinc-500">FPS</span>
        <span class="text-zinc-200 font-semibold">{{ fps() }}</span>
        <span class="text-zinc-700">/</span>
        <span class="text-zinc-500">OBJECTS</span>
        <span class="text-emerald-400 font-semibold">
          {{ currentDetectionsCount() }}
        </span>
      </div>
    </div>

    <div class="flex items-center space-x-2">
      <div class="flex rounded-lg bg-black/40 p-0.5 border border-white/[0.06]">
        <button
          type="button"
          (click)="setMode('WEBCAM')"
          [ngClass]="mode() === 'WEBCAM' ? 'bg-white/[0.08] text-white font-medium shadow-sm' : 'text-zinc-500 hover:text-zinc-300'"
          class="px-2.5 py-1 text-[10px] sm:text-[11px] font-mono rounded-md transition-all">
          CAMERA
        </button>
        <button
          type="button"
          (click)="setMode('IP_CAMERA')"
          [ngClass]="mode() === 'IP_CAMERA' ? 'bg-white/[0.08] text-white font-medium shadow-sm' : 'text-zinc-500 hover:text-zinc-300'"
          class="px-2.5 py-1 text-[10px] sm:text-[11px] font-mono rounded-md transition-all">
          IP FEED
        </button>
      </div>

      <button
        *ngIf="mode() === 'WEBCAM'"
        type="button"
        (click)="toggleCameraFacing()"
        class="flex items-center space-x-1 px-2.5 py-1 text-[10px] sm:text-[11px] font-mono rounded-md bg-white/[0.06] hover:bg-white/[0.1] border border-white/[0.08] text-zinc-200 transition-colors"
        title="Flip Camera">
        <svg class="w-3 h-3 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
        </svg>
        <span>{{ facingMode() === 'environment' ? 'BACK' : 'FRONT' }}</span>
      </button>

      <button
        type="button"
        (click)="toggleStream()"
        [ngClass]="isStreaming() ? 'bg-rose-500/15 text-rose-300 border-rose-500/30 hover:bg-rose-500/25' : 'bg-white text-zinc-900 hover:bg-zinc-200 border-transparent shadow-sm'"
        class="flex-1 sm:flex-initial px-3.5 py-1.5 text-xs font-mono font-medium rounded-lg border transition-all text-center">
        {{ isStreaming() ? 'STOP' : 'START' }}
      </button>
    </div>
  </div>

  <div *ngIf="mode() === 'IP_CAMERA'" class="flex items-center space-x-2 px-3.5 sm:px-5 py-2 bg-[#090a0d] border-b border-white/[0.06]">
    <span class="text-[11px] font-mono text-zinc-400">URL:</span>
    <input
      type="text"
      [ngModel]="ipStreamUrl()"
      (ngModelChange)="ipStreamUrl.set($event)"
      placeholder="http://192.168.1.100:8080/video"
      class="flex-1 bg-black/40 border border-white/[0.08] rounded-lg px-2.5 py-1 text-xs font-mono text-zinc-200 placeholder-zinc-600 focus:outline-none focus:border-white/30 transition-colors" />
  </div>

  <div class="relative flex-1 bg-[#060709] flex items-center justify-center overflow-hidden min-h-[300px] sm:min-h-[400px]">
    <video
      #videoElement
      autoplay
      playsinline
      webkit-playsinline
      muted
      class="w-full h-full object-contain"
      [ngClass]="mode() === 'WEBCAM' ? 'block' : 'hidden'">
    </video>

    <div *ngIf="mode() === 'IP_CAMERA' && isStreaming()" class="w-full h-full flex items-center justify-center bg-[#07080a] p-4 text-center">
      <div class="font-mono text-xs text-zinc-500">
        <div class="text-zinc-300 mb-2 font-medium">[ STREAMING IP FEED ]</div>
        <div class="text-zinc-600 text-[11px] truncate max-w-xs">{{ ipStreamUrl() || 'Awaiting IP Video Stream' }}</div>
      </div>
    </div>

    <div *ngIf="!isStreaming()" class="absolute inset-0 flex flex-col items-center justify-center bg-[#07080a] text-zinc-500 p-4 text-center">
      <div class="w-11 h-11 sm:w-12 sm:h-12 rounded-xl bg-white/[0.02] border border-white/[0.06] flex items-center justify-center mb-2.5">
        <svg class="w-5 h-5 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
        </svg>
      </div>
      <span class="font-mono text-[11px] sm:text-xs uppercase tracking-wider text-zinc-400">STANDBY</span>
      <span class="text-[10px] sm:text-[11px] text-zinc-600 mt-1">Press "START" to activate camera detection</span>
    </div>

    <canvas
      #hudCanvas
      width="1280"
      height="720"
      (click)="handleCanvasClick($event)"
      class="absolute inset-0 w-full h-full object-contain pointer-events-auto cursor-crosshair">
    </canvas>

    <canvas #hiddenCanvas class="hidden"></canvas>

    <div class="absolute bottom-3 left-3 right-3 sm:right-auto flex flex-wrap items-center gap-2">
      <button
        type="button"
        (click)="toggleDrawZone()"
        [ngClass]="isDrawingZone() ? 'bg-amber-400 text-zinc-950 font-semibold' : 'bg-black/60 hover:bg-black/80 text-zinc-300 border border-white/[0.1]'"
        class="px-2.5 py-1 text-[10px] sm:text-[11px] font-mono rounded-lg backdrop-blur-md transition-all shadow-lg">
        {{ isDrawingZone() ? 'DONE' : '+ DEFINE ZONE' }}
      </button>

      <div *ngIf="isDrawingZone()" class="flex flex-wrap items-center gap-1.5 bg-[#0e1014]/90 p-1.5 rounded-xl border border-white/[0.1] backdrop-blur-md shadow-2xl">
        <input
          type="text"
          [(ngModel)]="newZoneName"
          placeholder="Name"
          class="bg-black/50 border border-white/[0.08] rounded-lg px-2 py-0.5 text-[10px] sm:text-[11px] font-mono text-zinc-200 w-24 sm:w-32 focus:outline-none focus:border-white/30" />
        <input
          type="number"
          [(ngModel)]="newZoneDwell"
          placeholder="Dwell (s)"
          class="bg-black/50 border border-white/[0.08] rounded-lg px-2 py-0.5 text-[10px] sm:text-[11px] font-mono text-zinc-200 w-16 focus:outline-none focus:border-white/30" />
        <button
          type="button"
          (click)="saveDrawnZone()"
          class="bg-white text-zinc-950 font-medium px-2 py-0.5 rounded-md text-[10px] sm:text-[11px] font-mono hover:bg-zinc-200 transition-colors">
          SAVE
        </button>
        <button
          type="button"
          (click)="cancelDrawZone()"
          class="bg-white/[0.05] text-zinc-400 hover:text-zinc-200 px-1.5 py-0.5 rounded-md text-[10px] sm:text-[11px] font-mono transition-colors">
          &times;
        </button>
      </div>
    </div>
  </div>
</div>
